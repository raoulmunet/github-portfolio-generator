[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="github-portfolio-generator"
version="0.1.0"
description="Generate Markdown portfolios from public GitHub repositories."
readme="README.md"
requires-python=">=3.10"
license={text="MIT"}
authors=[{name="Raoul Munet"}]
dependencies=[]
[project.optional-dependencies]
dev=["pytest>=8"]
[project.scripts]
github-portfolio-generator="github_portfolio_generator.cli:main"
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
